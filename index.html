<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>有向數加減 - 互動教學平台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN for compiling JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@800;900&display=swap');
        body {
            font-family: 'Noto Sans HK', 'Microsoft JhengHei', sans-serif;
            background-color: #f1f5f9;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        /* iPad & Touch Event Fixes */
        button, [role="button"] {
            cursor: pointer !important;
            touch-action: manipulation !important;
            -webkit-tap-highlight-color: transparent;
        }
        /* Mobile scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out infinite;
        }
        @keyframes cinematic {
            0% { transform: scale(0.3) translateZ(0); opacity: 0; }
            20% { transform: scale(1.1) translateZ(0); opacity: 1; }
            80% { transform: scale(1) translateZ(0); opacity: 1; }
            100% { transform: scale(1.5) translateZ(0); opacity: 0; }
        }
        .animate-cinematic {
            animation: cinematic 1s ease-out forwards;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen m-0 p-0 overflow-hidden bg-slate-50">
    <div id="root" class="h-full w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SVG = {
            Back: () => (
                <svg className="w-5 h-5 inline-block mr-1 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            ),
            Refresh: () => (
                <svg className="w-4 h-4 inline-block mr-1 animate-spin pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 12H18M4 9h9M4 9l4-4"></path>
                </svg>
            ),
            Redo: () => (
                <svg className="w-4 h-4 inline-block mr-1 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 12H18M4 9h9M4 9l4-4"></path>
                </svg>
            ),
            OctopusCard: () => (
                <svg className="w-9 h-9 text-orange-500 pointer-events-none" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="4" width="20" height="16" rx="3" fill="currentColor" />
                    <circle cx="8" cy="12" r="3" fill="#ffffff" opacity="0.4" />
                    <circle cx="16" cy="12" r="3" fill="#ffffff" opacity="0.4" />
                    <rect x="11" y="9" width="2" height="6" fill="#ffffff" rx="1" transform="rotate(45 12 12)" />
                </svg>
            ),
            Trophy: () => (
                <svg className="w-12 h-12 text-yellow-500 mx-auto pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5a2 2 0 10-2 2h2zm-2 4h4M5 8h14a2 2 0 012 2v3a7 7 0 01-7 7H10a7 7 0 01-7-7v-3a2 2 0 012-2z"></path>
                </svg>
            )
        };

        // 4 MODES QUESTION GENERATOR
        function generateQuestion(mode) {
            let num1 = 0, num2 = 0, op = '+', expressionStr = '', val = 0, explanation = '', type = '';
            
            let selectedMode = mode;
            if (mode === 'mixed') {
                const modes = ['octopus', 'different_signs_only', 'brackets'];
                selectedMode = modes[Math.floor(Math.random() * modes.length)];
            } else if (mode === 'different_signs') {
                const modes = ['octopus', 'different_signs_only'];
                selectedMode = modes[Math.floor(Math.random() * modes.length)];
            } else if (mode === 'brackets') {
                selectedMode = 'brackets';
            }

            if (selectedMode === 'octopus') {
                const isPositive = Math.random() > 0.5;
                if (isPositive) {
                    num1 = Math.floor(Math.random() * 8) + 2; 
                    num2 = Math.floor(Math.random() * 8) + 2; 
                    op = '+';
                    val = num1 + num2;
                    expressionStr = `${num1} + ${num2}`;
                    explanation = `增值 $${num1}，再增值 $${num2}。同向累積：$${num1} + $${num2} = $${val}。`;
                } else {
                    num1 = -(Math.floor(Math.random() * 8) + 2); 
                    num2 = Math.floor(Math.random() * 8) + 2; 
                    op = '-';
                    val = num1 - num2;
                    expressionStr = `${num1} - ${num2}`;
                    explanation = `欠款 $${Math.abs(num1)}，再扣減 $${num2}。同向扣減：(${num1}) - ${num2} = ${val}。`;
                }
                type = 'octopus';

            } else if (selectedMode === 'different_signs_only') {
                const template = Math.floor(Math.random() * 2);
                if (template === 0) {
                    num1 = -(Math.floor(Math.random() * 9) + 2); 
                    num2 = Math.floor(Math.random() * 11) + 2;   
                    val = num1 + num2;
                    expressionStr = `${num1} + ${num2}`;
                    explanation = `正負號不同：先往左 ${Math.abs(num1)}，再往右 ${num2}。結果為 ${val}。`;
                } else {
                    num1 = Math.floor(Math.random() * 8) + 2;    
                    num2 = num1 + Math.floor(Math.random() * 6) + 1; 
                    val = num1 - num2;
                    expressionStr = `${num1} - ${num2}`;
                    explanation = `正負號不同：從 ${num1} 扣減 ${num2}（不夠減），結果為負數 ${val}。`;
                }
                type = 'directed';

            } else if (selectedMode === 'brackets') {
                const template = Math.floor(Math.random() * 4);
                num1 = Math.floor(Math.random() * 11) - 5; 
                if (num1 === 0) num1 = 4; 
                num2 = Math.floor(Math.random() * 8) + 2; 

                switch (template) {
                    case 0:
                        val = num1 - num2; 
                        expressionStr = `${num1 >= 0 ? num1 : `(${num1})`} + (-${num2})`; 
                        explanation = `正負得負：${expressionStr} 簡化為 ${num1} - ${num2} = ${val}。`; 
                        break;
                    case 1:
                        val = num1 + num2; 
                        expressionStr = `${num1 >= 0 ? num1 : `(${num1})`} - (-${num2})`; 
                        explanation = `負負得正：${expressionStr} 簡化為 ${num1} + ${num2} = ${val}。`; 
                        break;
                    case 2:
                        num1 = -Math.abs(num1); 
                        val = num1 + num2; 
                        expressionStr = `(${num1}) + ${num2}`; 
                        explanation = `從 ${num1} 向右移動 ${num2} 格。結果為 ${val}。`; 
                        break;
                    case 3:
                        num1 = -Math.abs(num1); 
                        val = num1 - num2; 
                        expressionStr = `(${num1}) - (+${num2})`; 
                        explanation = `負正得負：${expressionStr} 簡化為 ${num1} - ${num2} = ${val}。`; 
                        break;
                }
                type = 'directed';
            }

            let rawSum = Math.abs(num1) + Math.abs(num2);
            let rawDiff = Math.abs(Math.abs(num1) - Math.abs(num2));
            const optionsSet = new Set([val, rawSum, -rawSum, rawDiff, -rawDiff]);

            let safetyOffset = 1;
            while (optionsSet.size < 4) {
                optionsSet.add(val + safetyOffset);
                optionsSet.add(val - safetyOffset);
                safetyOffset++;
            }

            const options = Array.from(optionsSet).slice(0, 4).sort(() => Math.random() - 0.5);

            return { num1, num2, op, expression: expressionStr, answer: val, options, explanation, type };
        }

        // --- Visual Aid ---
        const VisualAid = ({ question, showAnswer }) => {
            if (!question) return null;

            if (question.type === 'octopus') {
                const total = question.answer;
                return (
                    <div className="flex flex-col items-center justify-center bg-orange-50 border-2 border-dashed border-orange-300 rounded-xl p-2 w-full h-full min-h-0 flex-1">
                        <div className="flex items-center gap-2 mb-1">
                            <SVG.OctopusCard />
                            <div className="text-left">
                                <p className="text-xs font-black text-orange-600">八達通交易模擬</p>
                            </div>
                        </div>
                        <div className="flex justify-around items-center w-full max-w-sm mt-1 text-sm">
                            <div className="text-center bg-white p-1.5 rounded-lg shadow-sm border border-slate-300 min-w-[70px]">
                                <span className="block text-[9px] font-bold text-slate-500 mb-0.5">初始金額</span>
                                <span className={`text-sm font-black ${question.num1 >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                    {question.num1 >= 0 ? `+$${question.num1}` : `-$${Math.abs(question.num1)}`}
                                </span>
                            </div>
                            <div className="font-black text-slate-400 text-sm">➔</div>
                            <div className="text-center bg-white p-1.5 rounded-lg shadow-sm border border-slate-300 min-w-[70px]">
                                <span className="block text-[9px] font-bold text-slate-500 mb-0.5">交易記錄</span>
                                <span className={`text-sm font-black ${question.op === '+' ? 'text-green-600' : 'text-red-600'}`}>
                                    {question.op === '+' ? `+$${Math.abs(question.num2)}` : `-$${Math.abs(question.num2)}`}
                                </span>
                            </div>
                            <div className="font-black text-slate-400 text-sm">➔</div>
                            <div className="text-center bg-orange-100 p-1.5 rounded-lg shadow-inner border border-orange-300 min-w-[70px]">
                                <span className="block text-[9px] font-bold text-orange-700 mb-0.5">最終餘額</span>
                                {showAnswer ? (
                                    <span className={`text-sm font-black ${total >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                        {total >= 0 ? `+$${total}` : `-$${Math.abs(total)}`}
                                    </span>
                                ) : (
                                    <span className="text-xs font-black text-slate-500 animate-pulse bg-slate-200 px-2 py-0.5 rounded">
                                        $ ?
                                    </span>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            const maxVal = 12, minVal = -12, range = maxVal - minVal;
            const getX = (val) => 40 + ((val - minVal) / range) * 720;
            const startX = getX(0), num1X = getX(question.num1), answerX = getX(question.answer);
            const ticks = [];
            for (let i = minVal; i <= maxVal; i += 2) ticks.push(i);

            return (
                <div className="w-full h-full flex-1 min-h-0 bg-blue-50 border-2 border-dashed border-blue-300 rounded-xl p-1.5 flex flex-col justify-center items-center">
                    <div className="text-[10px] font-black text-blue-700 mb-1">數線幾何對照演示</div>
                    <svg className="w-full h-full max-h-[80px]" viewBox="0 0 800 90" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                        <line x1="30" y1="50" x2="770" y2="50" stroke="#1e293b" strokeWidth="3" strokeLinecap="round" />
                        <polygon points="770,46 780,50 770,54" fill="#1e293b" />
                        <polygon points="30,46 20,50 30,54" fill="#1e293b" />

                        {ticks.map((tick) => (
                            <g key={tick}>
                                <line x1={getX(tick)} y1="45" x2={getX(tick)} y2="55" stroke="#1e293b" strokeWidth="2" />
                                <text x={getX(tick)} y="75" textAnchor="middle" className={`text-[12px] font-black ${tick === 0 ? 'fill-slate-900 text-[14px]' : 'fill-slate-600'}`}>{tick}</text>
                                {tick === 0 && <circle cx={getX(tick)} cy="50" r="4" fill="#000000" />}
                            </g>
                        ))}

                        {question.num1 !== 0 && (
                            <g>
                                <path d={`M ${startX} 50 Q ${(startX + num1X)/2} 20 ${num1X} 50`} fill="none" stroke="#ec4899" strokeWidth="3.5" strokeDasharray="4 4" />
                                <polygon points={`${num1X},50 ${num1X - (num1X > startX ? 8 : -8)},42 ${num1X - (num1X > startX ? 4 : -4)},50`} fill="#ec4899" />
                                <text x={(startX + num1X)/2} y="14" textAnchor="middle" className="text-[12px] font-black fill-pink-600">{question.num1 > 0 ? `+${question.num1}` : question.num1}</text>
                            </g>
                        )}

                        {num1X !== answerX && (
                            <g>
                                <path d={`M ${num1X} 50 Q ${(num1X + answerX)/2} 5 ${answerX} 50`} fill="none" stroke={answerX > num1X ? '#059669' : '#dc2626'} strokeWidth="4.5" />
                                <polygon points={`${answerX},50 ${answerX - (answerX > num1X ? 9 : -9)},37 ${answerX - (answerX > num1X ? 4 : -4)},50`} fill={answerX > num1X ? '#059669' : '#dc2626'} />
                                <text x={(num1X + answerX)/2} y="8" textAnchor="middle" className={`text-[12px] font-black ${answerX > num1X ? 'fill-emerald-700' : 'fill-red-700'}`}>
                                    {answerX > num1X ? '➔' : '➔'} ({question.answer - question.num1 > 0 ? `+${question.answer - question.num1}` : question.answer - question.num1})
                                </text>
                            </g>
                        )}
                        <circle cx={answerX} cy="50" r="5" fill="#2563eb" className="animate-pulse" />
                        <rect x={answerX - 14} y="78" width="28" height="12" rx="2" fill="#2563eb" />
                        <text x={answerX} y="87" textAnchor="middle" className="text-[9px] font-bold fill-white">落點</text>
                    </svg>
                </div>
            );
        };

        // --- TUG OF WAR SVG ---
        const TugOfWarSVG = ({ deltaScore }) => {
            const offset = deltaScore * 15;
            const centerPoint = 300 + offset;

            return (
                <div className="w-full max-w-2xl mx-auto bg-slate-800 rounded-lg p-1.5 border border-slate-900 shadow-sm shrink-0">
                    <div className="flex justify-between items-center text-[10px] font-bold text-slate-300 mb-0.5 px-2">
                        <span className="text-red-400">◀ 紅方</span>
                        <span className="bg-slate-700 px-2 py-0.5 rounded text-white font-black text-[9px]">
                            {deltaScore === 0 ? "勢均力敵" : deltaScore > 0 ? `紅領先 ${deltaScore}` : `藍領先 ${Math.abs(deltaScore)}`}
                        </span>
                        <span className="text-blue-400">藍方 ➔</span>
                    </div>
                    <svg className="w-full h-[40px] bg-slate-950 rounded overflow-visible" viewBox="0 0 600 45" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <line x1="300" y1="0" x2="300" y2="45" stroke="#f43f5e" strokeWidth="1.5" strokeDasharray="3 3" opacity="0.3" />
                        <line x1="20" y1="22" x2="580" y2="22" stroke="#e2e8f0" strokeWidth="3" strokeLinecap="round" />

                        <g transform={`translate(${centerPoint}, 22)`}>
                            <rect x="-4" y="-8" width="8" height="16" fill="#e11d48" rx="1.5" className="animate-pulse" />
                            <polygon points="-4,-4 0,-8 4,-4 0,8" fill="#facc15" />
                        </g>

                        {[50, 90, 130, 170].map((dist, i) => (
                            <g key={`red-${i}`} transform={`translate(${centerPoint - dist}, 22)`} className="transition-transform duration-300">
                                <line x1="8" y1="0" x2="16" y2="-8" stroke="#ef4444" strokeWidth="2.5" />
                                <circle cx="18" cy="-11" r="4.5" fill="#ef4444" />
                                <line x1="12" y1="-3" x2="55" y2="0" stroke="#ef4444" strokeWidth="2" />
                                <line x1="8" y1="0" x2="-2" y2="12" stroke="#ef4444" strokeWidth="2.5" />
                            </g>
                        ))}

                        {[50, 90, 130, 170].map((dist, i) => (
                            <g key={`blue-${i}`} transform={`translate(${centerPoint + dist}, 22) scale(-1, 1)`} className="transition-transform duration-300">
                                <line x1="8" y1="0" x2="16" y2="-8" stroke="#3b82f6" strokeWidth="2.5" />
                                <circle cx="18" cy="-11" r="4.5" fill="#3b82f6" />
                                <line x1="12" y1="-3" x2="55" y2="0" stroke="#3b82f6" strokeWidth="2" />
                                <line x1="8" y1="0" x2="-2" y2="12" stroke="#3b82f6" strokeWidth="2.5" />
                            </g>
                        ))}
                    </svg>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const [view, setView] = useState('menu');
            const [currentMode, setCurrentMode] = useState('octopus'); 
            const [countdown, setCountdown] = useState(null); 
            
            // Single
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [questionIndex, setQuestionIndex] = useState(1);
            const [singleScore, setSingleScore] = useState(0);
            const [isAnswered, setIsAnswered] = useState(false);
            const [selectedChoice, setSelectedChoice] = useState(null);
            const [wrongQuestions, setWrongQuestions] = useState([]);
            const [streak, setStreak] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [totalAnswered, setTotalAnswered] = useState(0);
            const [correctCount, setCorrectCount] = useState(0);

            // Dual
            const [dualScore, setDualScore] = useState(0); 
            const [dualRound, setDualRound] = useState(1);
            const [dualWinner, setDualWinner] = useState(null);
            // ADDED: redCooldown & blueCooldown
            const [dualStatus, setDualStatus] = useState({ 
                redClicked: null, 
                blueClicked: null, 
                isLock: false, 
                revealed: false,
                redCooldown: false,
                blueCooldown: false 
            });

            // Review
            const [reviewIndex, setReviewIndex] = useState(0);
            const [reviewWrongQuestions, setReviewWrongQuestions] = useState([]);
            const [reviewSelectedChoice, setReviewSelectedChoice] = useState(null);
            const [reviewAnswered, setReviewAnswered] = useState(false);
            const [showReviewExplainer, setShowReviewExplainer] = useState(false);
            const [reviewShowHint, setReviewShowHint] = useState(false);

            // Timer
            const [timeLeft, setTimeLeft] = useState(30);

            useEffect(() => {
                if (view !== 'single' && view !== 'dual') return;
                if (countdown !== null) return; 
                if (timeLeft <= 0) { handleGlobalTimeout(); return; }
                const timer = setTimeout(() => setTimeLeft(prev => prev - 1), 1000);
                return () => clearTimeout(timer);
            }, [timeLeft, view, countdown]);

            useEffect(() => {
                if (countdown === null) return;
                if (countdown > 0) {
                    const timer = setTimeout(() => setCountdown(prev => prev - 1), 1000);
                    return () => clearTimeout(timer);
                } else if (countdown === 0) {
                    const timer = setTimeout(() => setCountdown(null), 800); 
                    return () => clearTimeout(timer);
                }
            }, [countdown]);

            const handleBackToMenu = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                setView('menu');
                setCountdown(null);
                setCurrentQuestion(null); setQuestionIndex(1); setSingleScore(0); setIsAnswered(false);
                setSelectedChoice(null); setWrongQuestions([]); setStreak(0); setShowHint(false);
                setTotalAnswered(0); setCorrectCount(0); setDualScore(0); setDualRound(1); setDualWinner(null);
                setDualStatus({ redClicked: null, blueClicked: null, isLock: false, revealed: false, redCooldown: false, blueCooldown: false });
                setTimeLeft(30); setReviewIndex(0); setReviewSelectedChoice(null); setReviewAnswered(false);
                setShowReviewExplainer(false); setReviewShowHint(false);
            };

            const startSinglePlayer = (modeType) => {
                setCurrentMode(modeType); setQuestionIndex(1); setSingleScore(0); setWrongQuestions([]); setStreak(0);
                setIsAnswered(false); setSelectedChoice(null); setTotalAnswered(0); setCorrectCount(0); setShowHint(false);
                setTimeLeft(30); setCurrentQuestion(generateQuestion(modeType)); setView('single');
            };

            const startDualPlayer = (modeType) => {
                setCurrentMode(modeType); setDualScore(0); setDualRound(1); setDualWinner(null);
                setDualStatus({ redClicked: null, blueClicked: null, isLock: false, revealed: false, redCooldown: false, blueCooldown: false });
                setTimeLeft(30); setCurrentQuestion(generateQuestion(modeType)); setView('dual');
                setCountdown(3);
            };

            const handleGlobalTimeout = () => {
                if (view === 'single') setView('single-ended');
                else if (view === 'dual') {
                    if (dualScore > 0) concludeDualMatch('Red');
                    else if (dualScore < 0) concludeDualMatch('Blue');
                    else concludeDualMatch('Draw');
                }
            };

            const handleSingleChoice = (choice) => {
                if (isAnswered) return;
                setSelectedChoice(choice); setIsAnswered(true); setTotalAnswered(prev => prev + 1);

                if (choice === currentQuestion.answer) {
                    setSingleScore(prev => prev + 10); setStreak(prev => prev + 1); setCorrectCount(prev => prev + 1);
                    setTimeout(() => advanceSinglePlayer(), 500);
                } else {
                    setWrongQuestions(prev => prev.some(q => q.expression === currentQuestion.expression) ? prev : [...prev, currentQuestion]);
                    setStreak(0);
                }
            };

            const advanceSinglePlayer = () => {
                setQuestionIndex(prev => prev + 1); setIsAnswered(false); setSelectedChoice(null); setShowHint(false);
                setCurrentQuestion(generateQuestion(currentMode));
            };

            // DUAL PLAYER LOGIC UPDATED FOR 0.5s FREEZE PENALTY
            const handleDualChoice = (player, choice) => {
                if (dualStatus.isLock) return; // 全局鎖定 (有人答對)
                const isCorrect = choice === currentQuestion.answer;

                if (player === 'Red') {
                    if (dualStatus.redCooldown) return; // 如果正在凍結，無視點擊
                    
                    if (isCorrect) {
                        const newScore = dualScore + 1; setDualScore(newScore);
                        setDualStatus(prev => ({ ...prev, redClicked: choice, isLock: true, revealed: true }));
                        setTimeout(() => { newScore >= 4 ? concludeDualMatch('Red') : advanceDualPlayer(); }, 1000); 
                    } else {
                        // 答錯：只凍結自己 0.5 秒，不扣分，對方可繼續作答

                                <p className="text-slate-500 font-bold text-[10px] mb-3">最終成績：</p>
                                <div className="bg-slate-50 rounded-lg border border-slate-200 p-2 mb-3 text-xs grid grid-cols-3">
                                    <div><span className="block text-[8px] text-slate-400">得分</span><span className="font-black text-blue-600">{singleScore}</span></div>
                                    <div className="border-l border-slate-200"><span className="block text-[8px] text-slate-400">答對</span><span className="font-black text-emerald-600">{correctCount}/{totalAnswered}</span></div>
                                    <div className="border-l border-slate-200"><span className="block text-[8px] text-slate-400">錯題</span><span className="font-black text-rose-600">{wrongQuestions.length}</span></div>
                                </div>
                                <div className="flex flex-col gap-2">
                                    {wrongQuestions.length > 0 && <button type="button" onClick={startReviewMode} className="bg-yellow-400 text-slate-900 font-black py-2 rounded-lg border border-black text-xs shadow-sm"><SVG.Redo /> 重溫錯誤 ({wrongQuestions.length})</button>}
                                    <button type="button" onClick={() => startSinglePlayer(currentMode)} className="bg-orange-500 text-white font-black py-2 rounded-lg border border-black text-xs shadow-sm">重新作答</button>
                                    <button type="button" onClick={handleBackToMenu} className="bg-slate-800 text-white font-black py-2 rounded-lg border border-black text-[10px]">返回主選單</button>
                                </div>
                            </div>
                        )}

                        {view === 'dual-ended' && (
                            <div className="max-w-sm mx-auto w-full bg-white rounded-2xl border-2 border-black p-4 text-center shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] my-auto">
                                <TugOfWarSVG deltaScore={dualScore} />
                                <h2 className="text-2xl font-black mt-3 mb-1 animate-bounce">
                                    {dualWinner === 'Draw' ? <span className="text-slate-600">🤝 雙方平手!</span> : <span className={dualWinner === 'Red' ? "text-red-600" : "text-blue-600"}>🎉 {dualWinner === 'Red' ? '紅方' : '藍方'}獲勝!</span>}
                                </h2>
                                <div className="grid grid-cols-2 gap-2 mt-4">
                                    <button type="button" onClick={() => startDualPlayer(currentMode)} className="bg-indigo-600 text-white font-black py-2 rounded-lg border border-black text-[10px] shadow-sm">再來一局</button>
                                    <button type="button" onClick={handleBackToMenu} className="bg-slate-800 text-white font-black py-2 rounded-lg border border-black text-[10px]">返回選單</button>
                                </div>
                            </div>
                        )}

                        {view === 'review' && reviewWrongQuestions[reviewIndex] && (
                            <div className="flex-1 flex flex-col justify-start w-full min-h-0 max-w-2xl mx-auto">
                                <div className="shrink-0 flex justify-between items-center bg-yellow-400 p-2 rounded-lg border border-black mb-2 shadow-sm">
                                    <div className="font-black text-xs">重溫錯題: {reviewIndex + 1}/{reviewWrongQuestions.length}</div>
                                    <button type="button" onClick={() => setView('single-ended')} className="bg-slate-900 text-white font-black px-2 py-0.5 rounded text-[10px]">結束</button>
                                </div>
                                <div className="flex-1 min-h-0 mb-2 flex flex-col justify-center">
                                    {reviewWrongQuestions[reviewIndex].type === 'octopus' ? <VisualAid question={reviewWrongQuestions[reviewIndex]} showAnswer={reviewAnswered} /> : 
                                        reviewShowHint ? (
                                            <div className="relative w-full h-full flex flex-col">
                                                <VisualAid question={reviewWrongQuestions[reviewIndex]} showAnswer={reviewAnswered} />
                                                <button type="button" onClick={() => setReviewShowHint(false)} className="absolute top-1 right-1 bg-slate-800 text-white text-[8px] font-black px-2 py-0.5 rounded border border-slate-500">隱藏</button>
                                            </div>
                                        ) : (
                                            <div className="w-full h-full flex flex-col justify-center items-center bg-amber-50 border-2 border-dashed border-amber-300 rounded-xl p-2 min-h-[80px]">
                                                <span className="text-amber-800 font-black mb-1 text-[10px]">需要數線提示嗎？</span>
                                                <button type="button" onClick={() => setReviewShowHint(true)} className="bg-amber-500 text-white font-black py-1 px-3 rounded-md border border-black text-[10px] shadow-sm">顯示數線</button>
                                            </div>
                                        )}
                                </div>
                                <div className="shrink-0 bg-white rounded-xl border-2 border-black p-2 text-center shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] mb-2">
                                    <h3 className="text-3xl md:text-4xl font-black text-slate-800">{reviewWrongQuestions[reviewIndex].expression} = ?</h3>
                                </div>
                                <div className="grid grid-cols-2 gap-2 md:gap-3 shrink-0 mb-1">
                                    {reviewWrongQuestions[reviewIndex].options.map((opt, idx) => {
                                        let btnStyle = "bg-white text-slate-800 border-slate-700 hover:bg-amber-50";
                                        if (reviewAnswered) btnStyle = opt === reviewWrongQuestions[reviewIndex].answer ? "bg-green-500 text-white border-green-700 pointer-events-none" : "bg-slate-100 text-slate-400 border-slate-200 opacity-50 pointer-events-none";
                                        else if (opt === reviewSelectedChoice) btnStyle = "bg-red-500 text-white border-red-700 animate-shake";
                                        
                                        return <button type="button" key={idx} disabled={reviewAnswered || showReviewExplainer} onClick={() => handleReviewChoice(opt)} className={`text-2xl md:text-3xl font-black py-3 md:py-4 rounded-xl border-4 ${btnStyle} shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-y-0.5 flex justify-center items-center min-h-[50px]`}>{opt}</button>;
                                    })}
                                </div>
                                {showReviewExplainer && (
                                    <div className="shrink-0 bg-red-50 rounded-lg border border-red-400 p-2 shadow-sm flex justify-between items-center mt-1">
                                        <span className="text-red-800 text-[10px] font-black">❌ 提示: 注意正負號法則。</span>
                                        <button type="button" onClick={retryCurrentReviewQuestion} className="bg-yellow-400 text-slate-900 font-black px-3 py-1.5 rounded-md border border-black text-[10px] shadow-[1px_1px_0px_0px_rgba(0,0,0,1)]"><SVG.Refresh /> 重答</button>
                                    </div>
                                )}
                                {reviewAnswered && (
                                    <div className="shrink-0 bg-emerald-50 rounded-lg border border-emerald-400 p-2 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-2 mt-1">
                                        <span className="text-emerald-800 text-xs font-bold leading-tight flex-1">{reviewWrongQuestions[reviewIndex].explanation}</span>
                                        <button type="button" onClick={advanceReviewQuestion} className="w-full sm:w-auto bg-blue-600 text-white font-black px-4 py-2 rounded-md border border-black shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] text-[10px]">下一題 ➔</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
